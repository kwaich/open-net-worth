name: Docker

# Build-only smoke of the image, plus a boot: on every change to what goes into it, build,
# run it with a password, and hit the API and the SPA. The published image is built by
# release.yml; this keeps a broken Dockerfile or compose file from ever reaching a tag.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - docker-compose.yml
      - compose.build.yml
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - docker-compose.yml
      - compose.build.yml
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: open-net-worth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose refuses to start without AUTH_PASSWORD, accepts it with one
        run: |
          if docker compose config --quiet 2>/dev/null; then
            echo "::error::docker compose config succeeded with no AUTH_PASSWORD — it must refuse"
            exit 1
          fi
          AUTH_PASSWORD=ci docker compose config --quiet
          AUTH_PASSWORD=ci docker compose -f docker-compose.yml -f compose.build.yml config --quiet
      - name: Boot the image and probe it
        run: |
          docker run -d --name onw -e AUTH_PASSWORD=ci -p 127.0.0.1:8080:8080 open-net-worth:ci
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"version"'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8080/docs/ | grep -qi '<html'
      - name: Container log (on failure)
        if: failure()
        run: docker logs onw || true
