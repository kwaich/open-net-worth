# Spec: Assets Tab — Register, stepped create, section editing, values, dispose (AS-01 through AS-25)
# Black-box QA of the owned-assets feature after the 2026-09-26 create/edit redesign.
id: ASSETS-TAB
title: "Assets Tab — Register, Stepped Create, Section Editing, Values, Dispose"
