# Spec: PL-01 — Planning category-group reorder persists
# Covers: group reorder in Planning tab via keyboard DnD or direct API call
# Note: Drag-and-drop with mouse is notoriously unreliable for LLM browser agents.
# This spec falls back to using the keyboard-accessible DnD (Space to pick up,
# arrow keys to move) that @dnd-kit supports, OR verifies the API directly via
# curl if keyboard DnD also fails.
id: PL-01
acceptance_ids:
  - PLAN-DRAG-REORDER-WITHIN-GROUP
  - PLAN-LOAD
title: "Planning category-group reorder persists after page refresh"
description: >
  After reordering category groups in the Planning tab (via drag-and-drop
  or keyboard shortcut), the new order must survive a page refresh, confirming
  the order was persisted via POST /api/planning/groups/reorder.
  This spec prefers keyboard-based reorder (more reliable for automation)
  and falls back to API verification if the UI interaction is not feasible.

acceptance_criteria:
  - AC1: The Planning tab loads and shows at least 2 category groups
  - AC2: The group order can be changed (UI or API)
  - AC3: After a page refresh, the new order is preserved

# Task for the browser-use Agent
# The prototype-ported Budget table uses NATIVE HTML5 drag (mouse-only) — the old @dnd-kit
# keyboard DnD is gone (recorded a11y follow-up, docs/launch/BOARD.md 2026-07-04) and neither
# keyboard nor synthetic-mouse drag is reliable under browser automation. AC2/AC3 are verified
# through the same persistence path the drop handler calls: POST /api/planning/groups/reorder.
browser_use_task: |
  Navigate to {app_url} and click on the "Plan" tab in the left sidebar
  (it may be labelled "Plan" or "Planning"). Wait for the budget table to fully load.

  Step 1: Record the current group order.
  Identify and list all category group header names in the order they appear,
  SKIPPING any group named "Commitments" (locked) and the "Outside envelopes"
  section. There should be at least 2 reorderable groups.
  Call the first GROUP_A and the second GROUP_B.

  Step 2: Reorder via the persistence API (the exact call the drop handler makes).
  Using JavaScript in the page (evaluate), fetch GET {app_url}/api/planning/month?ym=
  the current YYYY-MM and read data.groups — collect the ids of the two groups whose
  names match GROUP_A and GROUP_B (ignore groups whose id starts with "__" and the
  Commitments group). Then POST {app_url}/api/planning/groups/reorder with JSON body
  {"order": [<GROUP_B id>, <GROUP_A id>, ...rest in their old order]} and the header
  Content-Type: application/json. Confirm the response is OK (2xx).

  Step 3: Refresh the page (F5). Wait for the Plan tab to reload fully.

  Step 4: Check persistence — verify via the API, not by eyeballing headers.
  Using JavaScript in the page (evaluate), fetch GET /api/planning/month?ym=<current YYYY-MM>
  again and read the group ids in order (same filtering as Step 2). GROUP_B's id must now come
  before GROUP_A's id. Also glance at the on-screen group headers: GROUP_B's name should appear
  above GROUP_A's (the synced "Commitments" group always renders first — ignore it).

  Decision:
  - If Step 2 returned 2xx AND Step 4's API order shows GROUP_B's id before GROUP_A's id: return "PASS: reorder persisted - <GROUP_B> is now first"
  - If Step 2 returned 2xx but Step 4's API order still shows GROUP_A first: return "FAIL: order reverted after refresh"
  - If the reorder POST failed: return "FAIL: reorder API returned an error"
  - If you cannot find the Plan tab or 2 reorderable groups: return "FAIL: could not find Plan tab or groups"

  Include the group names you observed in your response.

# Per-spec budget: the DnD flow (navigate + load + record groups + keyboard DnD
# + wait + verify + refresh + verify again) realistically needs ~15 agent steps
# and up to 3–4 minutes. Raise both limits so a legitimate run is not cut short.
max_steps: 25
timeout_seconds: 240

expected:
  pass_condition: "result contains 'PASS' or result contains 'SKIP'"
  screenshot_name: "PL-01-planning-reorder.png"
  note: >
    SKIP is acceptable here — drag-and-drop interactions are hard to drive
    reliably in headless browsers via LLM agents. The important assertion
    is that the API side works (covered by pytest tests). Use headed mode
    (--headed) for more reliable DnD testing in CI with visual debugging.
