# Every workflow action is pinned to a full commit SHA (a movable tag can be repointed at
# malicious code). Dependabot bumps the SHA and the trailing `# vX` comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
